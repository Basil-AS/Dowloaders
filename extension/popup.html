<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Forum & Article Saver</title>
<style>
  body{margin:0;width:300px;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1e1e2e;color:#cdd6f4}
  main{padding:16px}
  h1{font-size:15px;margin:0 0 10px;color:#f5c2e7}
  #site{padding:8px 10px;background:#313244;border-radius:8px;margin-bottom:12px}
  #opts{margin-bottom:12px}
  #opts label{display:block;font-size:13px;color:#bac2de;margin-bottom:4px}
  input[type=range]{width:100%;accent-color:#cba6f7}
  button{width:100%;padding:9px;border:0;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;background:#cba6f7;color:#1e1e2e}
  button:disabled{opacity:.4;cursor:default}
  #msg{margin-top:10px;font-size:12px;color:#a6adc8;word-break:break-word}
  .err{color:#f38ba8!important}
  small{display:block;margin-top:10px;color:#7f849c;font-size:11px}
</style></head>
<body><main>
  <h1>📥 Сохранить в .txt</h1>
  <div id="site">Определяю страницу…</div>
  <div id="opts" hidden>
    <label>Скачать: <b id="pctLabel">всё</b></label>
    <input id="pct" type="range" min="1" max="100" value="100">
  </div>
  <button id="go" disabled>Скачать</button>
  <div id="msg"></div>
  <small>Хабр · Reddit · 4PDA · форумы на Discourse (ntc.party и др.)</small>
</main><script src="popup.js"></script></body></html>
